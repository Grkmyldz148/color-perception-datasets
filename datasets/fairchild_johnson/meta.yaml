name: Fairchild_Johnson_1999
full_name: Fairchild & Johnson (1999) cross-media corresponding colors (printed / D65-CRT / D50-CRT)
schema: corresponding_colors
n_chips: 330
n_colors_per_medium: 110
n_media: 3
n_scenes: 6
n_observers: 30
n_trials_per_observer: 3
illuminant: D65 / 2°
type: >
  Cross-media color reproduction matches: 110 colors from 6 natural scenes
  (barn 24, colorchecker 25, fruit 19, golfer 25, noidea 1, pinklady 16),
  each given as a printed ↔ D65-CRT ↔ D50-CRT corresponding-color triple
  (3 media × 110 colors = 330 rows).
description: >
  Cross-media appearance-reproduction experiment by Fairchild & Johnson
  (1999): observers matched colors across printed hardcopy and CRT display
  under D65 and D50 states, producing corresponding-color triples per scene
  color. The hue_id column holds SCENE names (barn, colorchecker, fruit,
  golfer, noidea, pinklady), not hue loci. Useful as a corresponding-colors /
  chromatic-adaptation judge for cross-media reproduction.
notes:
- "⚠ SCHEMA DÜZELTMESİ (2026-06-12): Bu set constant-hue verisi DEĞİLDİR.
  coloria-dev kaynak dosyasının başlığı iki makaleyi karıştırır — abstract
  Ebner&Fairchild 1998 SPIE hue-yüzeyleri (306×15, o veri havuzda
  ebner_fairchild olarak ZATEN var), veri ise Fairchild&Johnson 1999 CR&A
  cross-media reproduction deneyi (printed ↔ D65-CRT ↔ D50-CRT eşleşmeleri).
  hue_id kolonu sahne adıdır, lokus değil. Constant-hue yargıcı olarak
  KULLANILAMAZ (G1 G0-c2 verdikti,
  color-space/research/fortress/G1_G0C2_VERDICT.md); corresponding-colors /
  adaptasyon yargıcı olarak kullanılabilir (printed↔CRT üçlüleri)."
- "2026-07-08 audit: 330 rows verified = 3 media × 110 colors, every color id
  complete as a printed/d65crt/d50crt triple; 15 rows at L=100 with nonzero
  a,b are printed-medium white patches (media-relative colorimetry). The 15
  rows at L=100 are plausible, not errors."
- "The raw YAML's top-level key is the medium (e.g. `printed`); inner keys are
  scene names — refer to the paper for details."
- "Per-chip observer counts and inter-observer variability are summarized in
  the paper but not preserved in the raw YAML."
sources:
- paper: 'Fairchild, M. D. & Johnson, G. M. (1999). Color Appearance Reproduction:
    Visual Data and Predictive Modeling. Color Research & Application 24(2), 121-131.'
- snapshot_source: coloria-dev/color-data (community extraction).
license: >
  Underlying data 1999; extraction by coloria-dev. License unspecified at
  coloria-dev; included under academic-use convention. Cite Fairchild &
  Johnson (1999).
