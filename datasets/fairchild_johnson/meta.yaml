name: Fairchild_Johnson_1999
full_name: Fairchild & Johnson (1999) constant-perceived-hue surfaces
schema: constant_hue
n_chips: 330
n_hue_angles: 15
n_observers: 30
n_trials_per_observer: 3
illuminant: D65 / 2°
type: constant-perceived-hue surfaces (306 colors × 15 hue angles, 30 observers ×
  3 trials)
description: Constant-perceived-hue surfaces measured by Fairchild & Johnson (1999)
  on a calibrated CRT for the cross-medium matching task 'which printed color corresponds
  to which CRT color of the same perceived hue?'. 306 sampled colors across 15 equally
  spaced hue angles (24° step in CIELAB), 30 observers, 3 trials each. Used to evaluate
  CIELAB and CIECAM97s hue uniformity; the article is the standard reference for cross-medium
  (printed vs display) hue surfaces.
notes:
- Denser than both Hung-Berns (156 chips × 5 hue families) and Ebner-Fairchild (306
  chips × 15 hue centers); but Ebner-Fairchild was on CRT only, while this dataset
  spans printed AND CRT media.
- The YAML's top-level key is the medium (e.g. `printed`); inner keys are scene names
  rather than hue numbers — refer to the paper for the angle-to-scene mapping.
- Per-chip observer counts and inter-observer variability are summarized in the paper
  but not preserved in the raw YAML.
sources:
- paper: 'Fairchild, M. D. & Johnson, G. M. (1999). Color Appearance Reproduction:
    Visual Data and Predictive Modeling. Color Research & Application 24(2), 121–131.'
- snapshot_source: coloria-dev/color-data (community extraction).
license: Underlying data 1999; extraction by coloria-dev. License unspecified at coloria-dev;
  included under academic-use convention. Cite Fairchild & Johnson (1999).
