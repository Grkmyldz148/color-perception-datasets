name: He_2022_3D_printed
full_name: He et al. (2022) — 3D-printed spherical samples color-difference
schema: delta_only
n_pairs: 82
n_chips: 45
experiments:
- I (42 pairs)
- II (40 pairs)
illuminant: D65, CIE 1964 10° observer
color_space_native: CIELAB (D65, 10°)
dv_units: 'Visual difference, two reporting conventions: dv_CLAB (CIELAB-anchored)
  and dv_DE2000 (DE2000-anchored)'
type: suprathreshold 3D-printed sample color difference
is_jnd: false
is_suprathreshold: true
description: 'Color-difference measurements on 45 3D-printed spherical samples by
  He et al. (2022). Two experiments (I: 42 pairs, II: 40 pairs) measured under D65
  with the CIE 1964 10° observer. The unusual physical substrate (matte 3D-printed
  plastic) makes it a useful out-of-distribution test for color-difference formulae
  trained on flat paint chips.'
notes:
- Source xlsx ships chips and pair-Δ values in separate sheets without a shared chip-pair
  index — the canonical layout therefore keeps chips in chips.csv and per-pair Δ values
  in canonical.csv with no direct link.
- 'Known scale-compression bias: model fits trained on it underestimate large differences
  and overestimate small ones. Don''t fit a simple linear regression and call it done.'
sources:
- paper: He, R., Xiao, K., Pointer, M., Bressler, Y., Liu, Z. & Lu, Y. (2022). Development
    of an Image-Based Measurement System for Human Facial Skin Colour. Color Research
    & Application.
license: CC BY 4.0 for this canonical export. Cite He et al. (2022).
canonical_note_2026_07_08: >
  Added the "group" column (Grey/Red/Green/Yellow/Blue) recovered from
  the raw xlsx block structure — pair_label alone was ambiguous ("Pair
  1" repeats per group). Endpoints remain unpublished even in the raw
  xlsx (delta-only dataset); cannot be used as pair_diff.
