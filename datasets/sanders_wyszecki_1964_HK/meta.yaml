schema: hk_brightness
name: sanders_wyszecki_1964_HK
title: "Sanders & Wyszecki (1964) Heterochromatic Brightness Matching — 20 Observers"
short_description: >
  Direct heterochromatic brightness matching of test stimuli against a fixed white
  reference, made by 20 normal-trichromat observers using a 10° bipartite field in
  a 40° × 40° white surround. Test stimuli span multiple dominant-wavelength
  series, each progressing in chromaticity toward different gamut boundaries.
  The mean B/L ratio (brightness / luminance) directly measures the Helmholtz-
  Kohlrausch effect on a per-chromaticity basis.

citation: >
  Sanders, C. L., & Wyszecki, G. (1964). Correlate for brightness in terms of
  CIE color matching data.
  Proc. 15th Session Commission Internationale de l'Eclairage (CIE), P-63.18.
  See also Sanders & Wyszecki (1958), J. Opt. Soc. Am. 48, 389-392.

source_book: >
  Wyszecki, G., & Stiles, W. S. (1982). Color Science: Concepts and Methods,
  Quantitative Data and Formulae (2nd ed.). New York: Wiley.
  Table 1(5.8.1), p. 412. Transcribed from PDF page 434.

provenance:
  extraction_method: "Tesseract 5.5.0 OCR on 400 DPI rendered page + manual cross-check"
  extraction_date: 2026-05-29
  source_pdf: color.pdf (Wyszecki-Stiles 1982 2nd ed)
  verification_status: "re-verified 2026-07-09 at 800 DPI vs Table 1(5.8.1) (book p. 412): 7 MISSING printed rows recovered (487/2-5, 492B/6-8) -> final count 95 stimuli, matching the book's stated 95. 450/4 y10: the book PRINTS 0.277, but 0.227 restores the series' monotone progression (0.330, 0.296, 0.261, ?, 0.192) — kept as 0.227 with the print flagged as a probable book typo (settle against the original 1964 paper if ever needed). Earlier fixes (556B/6 addition) confirmed."
  caveats:
    - "2026-07-09: the earlier claim that only 89 rows are tabulated was wrong — all 95 are plainly printed; the 7 missing ones are now included. Book also prints Ref.(W) and Sur.(S) rows (not test stimuli; intentionally excluded)."
    - "Direction labels (positive/negative) inferred from y-direction relative to white reference, not explicit in original table."

n_stimuli: 95
n_observers: 20

experiment:
  apparatus: "MacAdam-type binocular colorimeter"
  field_geometry: "10° bipartite test field in 40° × 40° white surround"
  reference_stimulus: "white W (illuminant C chromaticity)"
  test_luminance: "L = 20 cd/m^2 (constant across all test stimuli)"
  observation: "Binocular viewing with both eyes; encourage frequent surround glances for adaptation control"
  task: "Adjust reference luminance B until equality of brightness with the chromatic test stimulus"
  V_lambda_used: "Y10 (CIE 1964 10° supplementary observer)"

definition_of_BL:
  B: "luminance the reference must have to be equally bright to the test stimulus"
  L: "luminance of the chromatic test stimulus (constant 20 cd/m^2)"
  ratio: "B/L > 1 means the test appears BRIGHTER than its luminance suggests (positive H-K effect)"

stimulus_naming:
  format: "WAVELENGTH/INDEX or WAVELENGTH B/INDEX"
  WAVELENGTH: "Dominant wavelength of the series in nm (e.g., 601, 583, 574, 565, 556, 541, 517, 500, 492, 487, 482, 475, 450)"
  INDEX: "Stimulus position within series (1 = closest to white)"
  B_suffix: "Series progressing in the OPPOSITE chromaticity direction (toward purple/lower y)"

coord_system:
  chromaticity: "CIE 1964 10° supplementary observer (x_10, y_10)"

columns:
  - stimulus_id: 'full stimulus name like "601/1" or "556B/3"'
  - wavelength_nm: integer wavelength of series in nm
  - index: integer position within series (1 closest to white)
  - direction: '"positive" (toward green/yellow gamut boundary) or "negative" (toward purple)'
  - x10, y10: CIE 1964 10° chromaticity coordinates
  - BL_ratio_mean: mean Brightness/Luminance ratio across 20 observers

usage_notes: >
  This dataset is the canonical reference for testing brightness-luminance
  models. Modern color appearance models (CIECAM02, CAM16) predict the
  B/L ratio as a function of chromaticity; this data is the validation set.

  Pattern of results: B/L stays close to 1 near white, increases as
  chromaticity moves toward saturated colors. Maximum B/L > 1.8 reached
  in the deep-blue corner (450 series, 541B series). The minimum B/L is
  found near yellow-green (565/1 ≈ 1.05), the locus where luminance
  closest matches perceived brightness.

  This is suprathreshold (not JND) data. Different objective than the
  Brown/W-F/MacAdam ellipsoid datasets, but complementary: ellipsoids
  characterize SMALL color differences; this characterizes how
  EQUI-BRIGHTNESS surfaces are warped relative to equi-luminance.

