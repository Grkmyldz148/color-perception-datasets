audit_note_2026_07_09: >
  BT.2020 coverage SETTLED against the paper (PMC10609144): the experimental
  projector covers 93.3% OF BT.2020 (paper quote). The old 67.91% was a
  QUANTITY mixup, not a device mixup: it is the projector gamut's fraction of
  the total visible chromaticity-diagram area (BT.2020 itself = 63.72% on that
  scale; 66.36% = the separate 8K Laser TV, same area scale). All 30 stimuli +
  17 observer-CV values verified digit-exact vs Tables 2/3; primaries match
  Table 1.
