experiment:
  apparatus: "Wright's trichromatic colorimeter (foveal 2° field, dark surround)"
  observers:
    - id: author
      full_name: "W. D. Wright (Imperial College of Science and Technology, London)"
      n_lines: 35
    - id: HVW
      full_name: "H. V. Walters"
      n_lines: 5
    - id: RAL
      full_name: "R. A. Linfoot (uncertain initials)"
      n_lines: 5
    - id: THW
      full_name: "T.-H. (likely Thomson, L. C., Wright's collaborator)"
      n_lines: 5
  task: "Bipartite-field matching: observer adjusted halves to differ by a constant small chromaticity step (slightly larger than JND) while keeping brightness equal"
  retinal_illuminance: "~100 td"
  visual_field: "2° foveal"
  surround: "dark"

cie_purple_endpoints:
  description: "CIE 1931 coordinates of the three purple stimuli used as line endpoints (P1, P2, P3) in Wright's apparatus."
  P1: "x=0.550, y=0.206, z=0.244"
  P2: "x=0.395, y=0.155, z=0.450"
  P3: "x=0.304, y=0.074, z=0.622"

charts:
  CIE: "CIE 1931 (x, y) chromaticity diagram"
  RUCS: "Breckenridge-Schaub Rectangular Uniform Chromaticity Scale (1939) — Wright transformed his CIE results to test for uniformity improvement"

line_id_conventions:
  format: "ENDPOINT_A-ENDPOINT_B"
  ENDPOINT_A: "Either a wavelength in micrometers (e.g., 0.46) or a purple point (P1, P2, P3)"
  ENDPOINT_B: "Either a wavelength in micrometers (e.g., 0.65) or a purple point"
  position: "Distance l along the line from the shorter-wavelength endpoint (or from the purple endpoint Pi for purple-to-wavelength lines), expressed as a fraction"
  spectrum: "Special line_id; position is the wavelength itself (in micrometers); delta_step is the wavelength interval just-noticeable at that wavelength"

columns:
  - observer: author | HVW | RAL | THW | mean
  - chart: CIE | RUCS
  - line_id: identifier of the chromaticity line, e.g., "0.46-0.53", "P1-0.55", "spectrum"
  - position: position l along the line (fraction 0-1) OR wavelength in μm (for spectrum)
  - delta_step: just-noticeable chromaticity step size at that position

usage_notes: >
  Wright's data is the founding empirical evidence for the non-uniformity of the
  CIE 1931 (x, y) chromaticity diagram. The dramatic variation in delta_step
  values across the diagram (factor 10× between the "green" region and the
  "bluish-purple" region) directly motivated the search for uniform color
  spaces — leading to CIE 1976 u'v', CIELAB, OKLab, and modern measurement-space
  research.

  Each row represents one perceptually-equal chromaticity interval. The
  per-observer tables (Tables 1-4 in Wright's original) can be used to assess
  inter-observer variance; the mean tables (5, 7) give the canonical reference
  curve.

  The RUCS chart (Breckenridge-Schaub 1939) was an early uniform-chromaticity
  attempt. Wright showed the steps are more uniform in RUCS than CIE 1931
  but still vary substantially in the red corner — motivating later work
  (MacAdam 1942, Brown-MacAdam 1949, etc.).

  This dataset is THE original "Wright dashes" reproduced graphically in
  Wyszecki-Stiles (1982) Fig. 1(7.10.5) but extracted here in numerical form
  from the original 1941 paper.

caveats:
  - "Wright reports 35 lines tested by the author; this CSV transcribes the 34 published in Table 1 (plus the spectrum locus) and the 17 transformed in Table 6 (plus its spectrum locus) — some are subsets of the author's full 35-line set with auxiliary information lost in publication."
  - "Observer initials RAL and THW were not fully expanded in Wright's published acknowledgment; identified observers include H.V. Walters and L.C. Thomson per Wright's earlier collaborations."
  - "The 'spectrum locus' rows are perceptually equal wavelength steps along the spectral curve itself (where l is the wavelength in micrometers, not a fractional position along a straight line)."
  - "Some cells in Wright's original tables were blank or had auxiliary internal positions (e.g., P1-0.60 has a special l=0.15 point); these are preserved as additional rows in the CSV."
  - "RUCS transformation was applied by Wright himself; the canonical CSV preserves both representations for direct comparison."

license: "Public domain (1941 publication, copyright expired; original scientific data)"

