schema: jnd_steps
name: wright_1941_jnd_chromaticity
title: "Wright (1941) Sensitivity of the Eye to Small Colour Differences — JND Chromaticity Steps"
short_description: >
  Just-noticeable chromaticity steps measured along 35+ lines on the CIE 1931
  chromaticity diagram by W.D. Wright (author) plus 6 lines re-measured by 3
  additional observers (H.V.W., R.A.L., T.-H.W.). The position l along each
  line at which each step was measured, and the size of the step (delta_l)
  in CIE chromaticity coordinates, define the "Wright dashes" — the principal
  experimental basis for early uniform chromaticity scale development.

citation: >
  Wright, W. D. (1941). The sensitivity of the eye to small colour differences.
  Proceedings of the Physical Society of London, 53(2), 93-112.
  https://doi.org/10.1088/0959-5309/53/2/301

source_pdf: "/Volumes/harici_ssd/color-space/wright1941.pdf — Tables 1-7 (pp. 109-111)"

n_rows: 533
n_rows_by_table:
