name: natural_objects_2024_southern_cone_spectra
title: "Bigogno et al. (2025) Spectral Reflectance of Natural Objects from the Southern Cone of South America"
short_description: >
  Spectral reflectance measurements of 532 natural objects (Plants, Animals,
  Stones) from Northwestern Argentina, each measured at multiple incidence
  angles. Wavelength range 400-1000 nm in 4 nm increments. The largest publicly
  available spectral dataset of natural objects from the Southern hemisphere,
  including 242 plant species, 63 animal taxa, and 60 rocky natural objects.

  Particularly valuable because most spectral databases (Munsell, Kohonen,
  Universities of Eastern Finland, etc.) are Northern hemisphere biased.
  Includes spectra in the visible AND near-infrared range — useful for both
  human color perception research AND for hyperspectral imaging applications.

citation: >
  Bigogno, V., Ulla, J., Bullrich, D., Magrelli, M. F., Cogo, A., De Magalhaes, G.,
  De La Torre, M., Beckmann, F., Bauer, M., Acuña, F. J., Ricci, L. & Sara, D. (2025).
  Spectral dataset of natural objects' reflectance from the Southern cone of South America.
  Scientific Data (Nature) and figshare.
  DOI: https://doi.org/10.6084/m9.figshare.25705380
  Paper: https://www.nature.com/articles/s41597-025-04675-9

