usage_notes: >
  This dataset enables important color science research:

  1. NATURAL OBJECT COLOR GAMUT: Sample the full chromatic envelope of natural
     scene reflectances, distinct from synthetic Munsell patches or manufactured
     pigments.

  2. EVOLUTIONARY COLOR: Animal/plant taxa give phylogenetic signal — for
     studies of color evolution, mimicry, camouflage.

  3. COLOR CONSTANCY VALIDATION: Use natural reflectances as ground truth
     stimuli for testing color constancy / chromatic adaptation models.

  4. SOUTHERN HEMISPHERE BIAS CORRECTION: Most spectral databases are Northern
     hemisphere; this dataset reduces that bias for global color research.

  5. NIR EXTENSION: 400-1000 nm range supports both visible AND near-infrared
     analysis, useful for hyperspectral and remote sensing.

  For perceptia/measurement space testing:
  - Project these spectra through your space (via CIE 10° observer + D65)
  - Test whether natural object color distribution is "uniform" in your space
  - Compare with synthetic spectral distributions for evolutionary insight

caveats:
  - "Some non-UTF-8 characters in original CSV (Spanish accents in object names) — converted to UTF-8 with latin-1 source encoding."
  - "Photographs of all samples are in 'Samples_Photographs.rar' on figshare — not included here due to size (~325 MB)."
  - "Stones data is small (63 samples); for large-scale stone spectral studies, supplementary databases (e.g., USGS spectral library) may be needed."

