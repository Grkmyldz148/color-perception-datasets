description: Self-collected mobile-web color-difference test run by helmlab (helmlab.space)
  over ~3.5 hours on 24–25 February 2026. 71 Turkish-speaking observers gave 3,477
  valid suprathreshold judgements on a 0–100 slider plus a 1–5 categorical rating.
  Stimuli were not random — pairs are drawn from four designed zones (uniform, hk_boundary,
  achromatic_chromatic, blue_region) targeting specific perceptual regions. Each pair
  carries the device/platform/gamut/duration metadata captured at submission time.
  Useful as a real-world stress test for any color-difference formula or color space,
  especially for zone-specific failure modes.
notes:
- ★ Self-collected by helmlab — not a published academic dataset. Cite as such.
- Four designed zones (not random sampling). Aggregating across zones dilutes the
  zone-specific signal — stratify by `zone` when fitting.
- '`predicted_de` is the L2 Euclidean distance from the helmlab prototype space active
  at stimulus-design time (formula in helmlab/feedback/generator.py). The prototype
  predates the public helmlab repo and is not version-pinned, so `predicted_de` is
  NOT exactly reproducible. r≈0.95 with CIEDE2000 but non-constant scaling. Use it
  as a design tag, not ground truth.'
- 75 catch trials (identical hex pairs) already excluded — these were designed-in
  zero-difference pairs for reliability scoring.
- No display calibration. Observer monitors and ambient light vary. Stratify by `color_gamut`
  (sRGB vs P3) and `platform` if you need cleaner subsets.
- All observers are Turkish-language users (tr-TR); cross-cultural generalization
  is unverified.
- Observer names → `observer_001`..`observer_071`. The real-name mapping (observer_mapping.local.json)
  is NOT included in this repository.
