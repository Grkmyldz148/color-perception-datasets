[common]
parnames = [ref_dim1, ref_dim2, delta_dim1, delta_dim2]
stimuli_per_trial = 1
outcome_types = [binary]
strategy_names = [init_strat_sobol_small, init_strat_sobol_medium, init_strat_sobol_large, opt_strat]

[ref_dim1]
par_type = continuous
lower_bound = -0.75
upper_bound = 0.75

[ref_dim2]
par_type = continuous
lower_bound = -0.75
upper_bound = 0.75

[delta_dim1]
par_type = continuous
lower_bound = -0.25
upper_bound = 0.25

[delta_dim2]
par_type = continuous
lower_bound = -0.25
upper_bound = 0.25

[init_strat_sobol_small]
generator = SobolGenerator
min_asks = 300

[init_strat_sobol_medium]
generator = SobolGenerator
min_asks = 300

[init_strat_sobol_large]
generator = SobolGenerator
min_asks = 300

[opt_strat]
generator = OptimizeAcqfGenerator
min_asks = 6600
model = GPClassificationModel
acqf = EAVC
refit_every = 20

[GPClassificationModel]
max_fit_time = 3
use_gpu = True

[OptimizeAcqfGenerator]
restarts = 10
samps = 1000
max_gen_time = 1
use_gpu = True

[EAVC]
target = 0.667
objective = ProbitObjective