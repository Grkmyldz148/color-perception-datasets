name: Hong_2025_Ellipsoids
full_name: Hong et al. (2025) isoluminant JND ellipsoid grid (Hong, Bouhassira, Chow, Sanders, Shvartsman, Guan, Williams & Brainard)
schema: jnd_ellipses
n_ellipses: 84872
n_subjects: 8
n_grid_points_per_subject: 10609
grid_size: "103 × 103 (isoluminant 2-D)"
plane: "isoluminant (DKL-derived 2D Wishart Process plane)"
illuminant: "calibrated DELL U2723QE (IPS Black, 3840×2160@60Hz), ≈300 cd/m² white"
type: "modern dense JND ellipsoid grid (Wishart Process Psychophysical Model)"
is_jnd: true
is_suprathreshold: false
description: |
  Dense per-subject JND ellipsoid field fitted via the Wishart Process
  Psychophysical Model from Hong et al. (eLife 2025).
  Eight color-normal observers completed ~12,000 trials each (mix of
  adaptive AEPsych + MOCS replications). The Wishart Process produces
  a SMOOTH 2-D field of 2x2 covariance matrices Σ(x, y) across the
  isoluminant plane (DKL-derived 2DW coordinates, range [-0.85, 0.85]).
  Each subject's fit is a 103×103 grid of Σ, providing a JND ellipsoid
  at every point — replacing MacAdam 1942's 25 ellipses with 10,609
  per observer.

  This is the modern direct descendant of MacAdam 1942: fixes both of
  MacAdam's chief limitations — single observer + sparse sampling — and
  uses contemporary adaptive psychophysics + Bayesian smoothing.
notes:
  - "★ Each row gives a fitted ellipsoid as both the raw 2x2 covariance (sigma_xx, sigma_xy, sigma_yy) and the derived ellipse semi-axes (a, b) plus rotation theta_deg. Both representations are equivalent."
  - "Grid coordinates (x, y) are in DKL-derived 2DW units, NOT CIELAB. Use the calibration matrices in raw/ (M_2DWToRGB, M_2DWToDKLPlane) to map to RGB or DKL."
  - "Wishart Process smoothing means adjacent grid points are not independent. Don't treat the 84,872 ellipses as 84,872 independent measurements; effective DOF per subject ≈ ~100."
  - "Bootstrap iterations (120 per grid point) are NOT included in this canonical export to keep size reasonable. The original Zenodo CSV has all 120 bootstraps if you need confidence intervals."
  - "★ This is the gold-standard JND dataset published in the project's diagnostic era; supersedes MacAdam 1942 for isoluminant JND evaluation. MacAdam 1942 remains in the pool for historical comparison only."
sources:
  - paper: "Hong, F. F., Bouhassira, N., Chow, D., Sanders, K., Shvartsman, M., Guan, L., Williams, D. & Brainard, D. H. (2025). Comprehensive characterization of color discrimination thresholds with a Wishart Process Psychophysical Model. eLife reviewed preprint 108943."
  - data: "OSF project k27js (https://osf.io/k27js/) — 525 raw files, 1.36 GB. This canonical export is the per-subject Σ_org grid only (~7 MB)."
  - code: "https://github.com/fh862/ellipsoids_eLife2025"
license: "CC BY 4.0 (OSF project license). Cite Hong et al. (2025)."
corrections_2026_07_08:
  - "Author list fixed: 'Yoon, Yoo' do not exist; real list is Hong, Bouhassira, Chow, Sanders, Shvartsman, Guan, Williams, Brainard (verified against eLife RP108943 / bioRxiv)."
  - "Display fixed: DELL U2723QE is an IPS Black panel, not OLED."
  - "DONE 2026-07-08: calibration matrices pulled from OSF k27js into raw/ (M_RGBToXYZ1931 + inverses + LMS variants + TransformMatrices_README). Key facts from the calibration README: 2DW->RGB output is LINEAR monitor RGB (no gamma); M_RGBToXYZ1931 is from PR-670-measured primaries, Y in cd/m2, white ~190 cd/m2. The ColorBench hong judge now runs fully colorimetric (linear RGB -> XYZ1931 -> relative -> Bradford monitor-white->D65) and is promoted to the validated tier."
