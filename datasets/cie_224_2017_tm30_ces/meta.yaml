name: cie_224_2017_tm30_ces
title: "CIE 224:2017 / ANSI/IES TM-30 — 99 Color Evaluation Samples (CES)"
short_description: >
  Reflectance spectra of 99 Color Evaluation Samples (CES01-CES99) used by the
  CIE 224:2017 Colour Fidelity Index (R_f) and ANSI/IES TM-30-18/20 colour
  rendering evaluation methods. These 99 carefully-selected reflectance spectra
  span a wide gamut and represent natural and man-made objects (saturated
  reflectances, skin, foliage, textiles) and are the modern standardized
  replacement for the 14 TCS samples used in CIE Ra (1965).

citation: >
  CIE 224:2017. CIE 2017 Colour Fidelity Index for accurate scientific use.
  International Commission on Illumination, Vienna.
  https://doi.org/10.25039/TR.224.2017

  ANSI/IES TM-30-20. IES Method for Evaluating Light Source Color Rendition.
  Illuminating Engineering Society, New York.
  https://www.ies.org/standards/

  David, A. et al. (2015). Development of the IES method for evaluating the
  color rendition of light sources. Optics Express, 23(12), 15888.
  https://doi.org/10.1364/OE.23.015888

source: >
  Reflectance spectra reproduced from colour-science Python library
  (https://github.com/colour-science/colour),
  file colour/quality/datasets/tcs_cfi2017_1_nm.csv.gz, which mirrors the
  CIE-published spectra. Same data is distributed by NIST in their TM-30
  calculator workbook.

provenance:
