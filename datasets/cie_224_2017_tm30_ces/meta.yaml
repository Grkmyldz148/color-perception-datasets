n_samples: 99
n_wavelengths: 400  # 380-779 nm at 1 nm step
wavelength_range_nm: [380, 779]
wavelength_step_nm: 1

format: "wide — one row per wavelength, one column per CES sample"

schema:
  - wavelength_nm: wavelength in nanometers (380-779)
  - CES01 through CES99: spectral reflectance factor at this wavelength (0.0 to 1.0+) for sample CES_i

usage_notes: >
  CES samples are the modern standard for color rendering evaluation. To compute
  TM-30 R_f (fidelity) or R_g (gamut) for a test light source:

  1. Multiply each CES reflectance spectrum by the test source SPD
  2. Compute CIE 10° tristimulus values for each
  3. Apply CAT02 chromatic adaptation to D65
  4. Convert to a uniform color space (CAM02-UCS)
  5. Compute color differences against a matched reference (Planckian for
     CCT < 5000 K, D-series otherwise)
  6. R_f = 100 - 7.54 × mean(ΔE')
  7. R_g = 100 × (gamut area / reference gamut area)

  The 99 CES were selected from a database of ~100,000 real-world reflectances
  to span the maximum gamut while satisfying constraints on saturation,
  brightness, and hue uniformity. See David et al. (2015) for selection
  methodology.

  This is THE modern reference for light source color quality. It replaces
  CIE Ra (8 + 6 = 14 TCS samples from 1965) which is now considered obsolete
  but still widely cited.

  In our pool, TM-30 CES samples enable:
  - Computing modern fidelity scores for any test light SPD
  - Calibration of color-space color difference metrics on a broad sample set
  - Validation that a perceptual uniformity claim covers the real-world gamut

