description: 'A compilation of 132+ chromaticity-discrimination ellipses for surface
  colours, gathered by M. R. Luo and B. Rigg (1986) from ten independent source studies
  (VVVR, BFD, MMB, CISCC, CIE, STROCKA, WITT, DF, MCD, K) and harmonized via per-set
  scaling factors. Larger and more diverse than the MacAdam 1942 set (which used a
  single observer on isolated lights) — Luo-Rigg covers real surface-color conditions
  and multiple observer pools. The paper''s headline finding: contrary to MacAdam
  1942, the smallest discrimination ellipses lie in the blue-grey region for surface
  colors. The standard JND dataset for any color space that claims to model real-world
  textile/paint/dye color tolerances rather than just isolated stimuli.'
notes:
- 10 source sets with very different sample sizes — filter by `set_name` for a single
  source. Don't pool naively; the `set_factor` column carries the per-set scaling
  Luo & Rigg derived to bring sets onto a common scale.
- ★ Surface-color JND — different from MacAdam 1942 (isolated lights). The blue-grey
  minimum here vs MacAdam's blue maximum is a long-standing puzzle in the literature.
- Ellipse semi-axes (a, b) stored in chromaticity units (a×10⁻⁴ scale already applied).
  Use a/b ratio when comparing aspect ratios to MacAdam.
- set_factor R̄ is the relative size factor per source set; multiply a and b by R̄
  to recover the raw per-source size, or divide by R̄ to project onto the common scale.
sources:
- paper: Luo, M. R. & Rigg, B. (1986). Chromaticity Discrimination Ellipses for Surface
    Colours. Color Research & Application 11(1), 25–42.
