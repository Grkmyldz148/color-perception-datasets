  Full-table digit-level re-verification against Wyszecki-Stiles (1982) Table
  II(5.4.2) at zoom: ALL 46 rows x 15 columns CONFIRMED-CLEAN (0 transcription
  errors). Column rename: a/b are x10^-3 per the book header (old _x1e4 names
  were wrong by 10x). Known BOOK-INTERNAL inconsistencies transcribed
  faithfully (printed theta/a/b vs g-derived): c5-straight a, c12-straight
  theta, c13-2deg-straight theta (printed 0, true 90 — book misprint),
  c13-2deg-weighted a, c15-straight a/b, c22-weighted a. Judges should trust
  the g-matrix over printed a,b.
